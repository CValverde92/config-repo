server:
  port: 8083

spring:
  application:
    name: transaction-service  # Corregido: antes decía "credit-service"
  data:
    mongodb:
      host: ${MONGO_HOST:localhost}
      port: ${MONGO_PORT:27017}
      database: transactiondb
      auto-index-creation: true

transaction:
  limits:
    max-amount: 10000.0
    min-amount: 1.0
  types:
    - DEPOSIT
    - WITHDRAWAL
    - TRANSFER
    - PAYMENT

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics